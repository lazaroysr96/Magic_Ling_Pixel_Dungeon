####Hollow

windows.wndstory.hollow=El antiguo santuario se ha transformado en un castillo ancestral, y una energía ominosa fluye por el lugar…
windows.wndstory.hollowpolt=Al entrar en este misterioso castillo, su inusual decoración y las criaturas que lo habitan captan tu atención de inmediato.\n\nPero de repente, sientes un fuerte dolor de cabeza y mareo—en medio de la confusión, alguien susurra: “Entra, necesito tu ayuda.”\n\nMiras a tu alrededor, pero no ves a nadie.

######

windows.wndstory.aientncity=Siguiendo la luz, llegaste a este lugar guiado por fuerzas desconocidas. Fósiles de criaturas antiguas, columnas de piedra deformadas...\nEl entorno está repleto de enredaderas, estalactitas y paredes de roca que emiten sonidos inquietantes.\nAlgunas zonas irradian un misterioso aire de vida, y los susurros en las sombras sugieren que algo acecha en la profundidad. Quizás puedas descubrir qué ocurre en este lugar.

windows.wndstory.sewers=Los densos árboles forman la capa superficial de la mazmorra. Aunque aún no has entrado, la energía oscura del subsuelo ya se ha filtrado en la superficie.\nLos árboles son más frondosos que en cualquier otro bosque, bloqueando casi por completo la luz del sol.\nSin embargo, parece que la influencia de la energía oscura solo llega hasta aquí—si puedes ignorar las criaturas extrañas que aparecen de vez en cuando, el bosque no se diferencia mucho de otros lugares similares.

windows.wndstory.sewersboss=El fondo del bosque no es un laberinto de raíces, sino una red de enredaderas verdes.\nHan tejido una vasta estructura, atrapando a los seres que caen por ilusiones y llevándolos al núcleo—una fruta roja.\nEste lugar es el corazón del bosque, su fuente de vida.


windows.wndstory.exboss1=El fondo del bosque ya no es un tranquilo océano verde, sino un reino de silencio y muerte. Aquí no hay animales, solo un corazón rojo latiendo entre las sombras. Enredaderas han envuelto los árboles, formando una red que cubre el cielo y amenaza con atrapar a los intrusos.\nLas frutas rojas desprenden un aroma embriagador, atrayendo a los viajeros desprevenidos—pero son veneno mortal. Aquellos que las prueban perecen en cuestión de minutos.\nLa oscuridad consume el bosque, lleno de peligros invisibles. Cada ser atrapado aquí se convierte en alimento para la naturaleza misma.\nAquí no hay escapatoria. ¡Huye si puedes!

#windows.wndstory.prison=Hace años, se construyó una prisión subterránea para contener a los criminales más peligrosos. Su seguridad extrema y vigilancia estricta convirtieron este lugar en un infierno para los prisioneros.\n\nPero el caos pronto dominó el recinto: la energía oscura comenzó a distorsionar las mentes de los prisioneros y los guardias.\n\nEl desorden se apoderó de la prisión. La ciudad finalmente selló su acceso, y ahora nadie sabe qué seres acechan tras estos muros...\n\nEste lugar ya no tiene ley. Para sobrevivir, tendrás que destruir todo lo que encuentres.

windows.wndstory.prison=El corazón cristalino emana un frío que se mezcla con el vapor de los árboles, creando una nieve ligera que cubre la prisión antigua.\n\nAquí hace más frío que en la superficie, pero no lo suficiente como para congelarte.\n\nHace tiempo que la vida abandonó este lugar. Ahora los muertos y espíritus vagan entre las ruinas.


windows.wndstory.prisonboss=“En este mundo, no hay bien ni mal. Como asesino, solo debes servir a tu cliente.”\nEstas palabras quedaron grabadas en la memoria de Tengu.\nComo uno de los mejores asesinos del mundo, ¿quién fue su empleador? ¿Cómo terminó aquí?\nNadie conoce la historia completa.\nTal vez Tengu no tenga nada que ver contigo, pero la llave de la entrada a la mina está en su poder.\nPor alguna razón, no tiene intención de dejarte pasar.\n¿Será este el inicio de tu leyenda, o el fin de tu viaje?\n—Él te ha estado esperando.

windows.wndstory.coldchest=La zona que alguna vez albergó a los criminales más peligrosos ha cambiado radicalmente. La temperatura sigue bajando. Una batalla inevitable se aproxima…

windows.wndstory.caves=La tormenta de nieve se detiene aquí, pero el frío continúa intensificándose. Este sistema de cavernas se extiende desde la prisión abandonada hasta las profundidades subterráneas.\n\nHace mucho que nadie habita este lugar, y ahora está completamente cubierto por el hielo. Para la ciudad, esta cueva es demasiado profunda y difícil de explotar, y la falta de minerales valiosos hizo que los enanos la ignoraran por completo. Hubo un puesto comercial aquí en el pasado, construido por dos facciones, pero tras la caída del reino enano, solo los gnolls y criaturas subterráneas permanecieron aquí.\n\nSin embargo, la magia oscura se ha apoderado de este lugar.\n\nAhora es un sitio extremadamente peligroso.

windows.wndstory.cavesboss=Origen, crecimiento, esplendor, decadencia, crisis, rebelión, conspiración, caída.\n\nEsta es la historia del reino enano.\n\nAhora, los enanos saben que te acercas.\n\nHan preparado algo especial para ti. ¿Ves esa máquina frente a ti?\n\nEs la DM, una gigantesca máquina minera enana.\n\nPero ahora, solo sirve como guardián de estas tierras.\n\n¿Qué está esperando?\n\n¿Por qué estamos aquí?\n\nSegún los antiguos registros de tu hogar, este lugar fue una vez un próspero reino enano.\n\nLa DM aún no te ha detectado. Tal vez no sea culpa suya, pero si quieres seguir explorando las profundidades de la mazmorra…\n\nTendrás que enfrentarte a esta máquina en una batalla a muerte.\n\nRecuerda: confía en ti mismo. ¡Sobrevive!

windows.wndstory.icedead=La muerte no es nuestro final, sino nuestro inicio.\n\n-En el momento de mi caída, fui aislado del mundo. Ahora, ¿quién podrá ayudarme?

windows.wndstory.city=La ciudad enana fue una vez el reino más glorioso de los enanos. En su apogeo, sus ejércitos mecanizados repelieron la invasión de los Antiguos y sus legiones demoníacas. Sin embargo, algunos afirman que los guerreros que regresaron triunfantes trajeron consigo una semilla de corrupción, y que su victoria marcó el inicio de la caída del reino enano.\n\nLa magia oscura es cada vez más intensa en este lugar… ¿Quién está realmente detrás de todo?

windows.wndstory.cityboss=A través de innumerables batallas, finalmente llegaste a la sala del trono del rey enano.\n\nDesde el principio, sabías la verdad: “Esto ya no es el reino enano. Esto es el paraíso de los demonios.”\n\nEl instigador de la caída del reino enano conoce tu presencia.\n\nY tú también sabes que esta será la primera y última vez que te enfrentes al rey enano.\n\nYa estás listo. ¡Lucha con todas tus fuerzas!

windows.wndstory.halls=Hace mucho tiempo, esta zona solía ser la periferia de la ciudad enana. Cuando los enanos obtuvieron una victoria pírrica contra los Antiguos, quedaron demasiado debilitados para controlar esta región. Con el tiempo, los demonios sobrevivientes consolidaron su dominio sobre estas tierras. Ahora, este lugar es conocido como el Salón Demoníaco.\n\nPocos aventureros han logrado llegar hasta aquí...
###mio
windows.wndstory.hallsboss=Aquí no hay nada.\n\nAquí no hay vida.\n\nAquí es el principio.\n\nAquí reina el silencio absoluto.\n\nPero lo entiendes: ¡esto es una prueba!\n\nNo hay escapatoria, debes enfrentarlo. ¿Estás listo?

windows.wndstory.new=Después de derrotar al Antiguo Yog-Dzewa, todo parece haber vuelto a la calma.\n\nPero en tu interior, sientes que esta historia aún no ha terminado.\n\nPor ahora, todo está en orden. Pronto descenderás al palacio de los Antiguos, reclamarás el último botín de guerra y te marcharás con honor.\n\nSin embargo, esta mazmorra…\n\nSiempre has creído en ella.\n\nEntonces, algo cambia ante tus ojos. ¿Qué te espera más adelante?

windows.wndstory.forest=Después de atravesar la tormenta de nieve, aparece ante ti un pequeño pueblo tranquilo y pacífico.\n\nEn sus inicios, muchos aventureros construyeron pequeñas cabañas en la entrada de la mazmorra. Con el tiempo, más exploradores llegaron y edificaron nuevas estructuras, hasta que finalmente el lugar se convirtió en una verdadera comunidad.\n\nPuedes ver la nieve caer furiosamente fuera del pueblo, pero lo más sorprendente es que, al acercarse, los copos parecen calmarse, transformándose en suaves y delicadas partículas antes de tocar el suelo. Las ramas cubiertas de nieve reflejan la luz del sol con un brillo plateado.\n\nEn este reino helado, un pueblo cálido y pacífico es un contraste inesperado, pero al mismo tiempo, un lugar esencial.\n\nQuizás puedas visitar la posada y obtener algo de información.

windows.wndstory.aic=El antiguo pueblo nevado ha quedado en ruinas. De los tres líderes que dominaban la superficie, ninguno puede encontrarse ahora. Este lugar es una ciudad solitaria. Es el futuro. Es tanto el punto de partida como el destino final.

windows.wndstory.lava=Al llegar aquí, el polvo y el calor te envuelven por completo. Respiras con dificultad. Las grietas atraviesan la superficie rojiza del suelo, y cuando miras hacia el horizonte, todo lo que ves es un inmenso lago de lava ardiente.\n\nRecuerdas a los antiguos guardianes. Sus huellas han sido borradas por el tiempo y sus almas descansan aquí para siempre.\n\nPero no planeas retroceder. Agarras tu arma con firmeza. Todo está a punto de comenzar.

windows.wndstory.lavaboss=La presencia más aterradora. La raíz de la corrupción del bosque. La guarida del Dragón de Lava está ante ti.\n\nEs hora de poner fin a su reinado…

windows.wndtradeitem.stole=Robar en la tienda
windows.wndtradeitem.oks=Iniciar conversación
windows.wndstory.dm920=La caída de Yog-Dzewa oculta demasiados secretos.\nDetrás de Yog hay un experimento DM tan aterrador que incluso Yog le temía.\nEs el causante de la ruina del reino enano. Es el símbolo del desastre.\nEs el arma definitiva del ejército de los muertos vivientes. Es el avatar de la muerte.\nEs la abominación conocida como DM920.\nTu destino es enfrentarlo, no huir.\nNo hay vuelta atrás. Solo queda una batalla desesperada, sin importar si es real o un espejismo.\nPero sabes que si no lo derrotas, el único que morirá… serás tú.

windows.wndgoshop.szo=Comerciante de la mazmorra
windows.wndgoshop.ary=Oh, veo que te interesa mi mercancía. Pero te advierto, si intentas hacer algo sospechoso… ¡Mejor olvídalo!\n\nEl comerciante te observa con extrema cautela. Si decides robar la tienda, algo extraño podría ocurrir en esta capa de la mazmorra.\n\n¿Qué decisión tomarás?\n-Nota: Si robas, viajarás al Cañón Nevado y recibirás la maldición de los susurros de la Bruja de las Llamas Oscuras, Lena. Antes de la teletransportación, **todos tus crucifijos serán eliminados. No los lleves contigo**.
windows.wndgoshop.yes=Robar
windows.wndgoshop.no=Abandonar
windows.wndgoshop.notbad=Vaya, pensé que querías robarme…
windows.wndgoshop.bad=Comerciante: %s, elegiste huir del Cañón Nevado. Por lo tanto, has fallado.
windows.wndgoshop.ots=Lena ya me informó de todo mediante telepatía. Ahora, toda esta mercancía es tuya.\n\nSin embargo, tengo que regresar al Cañón Nevado. No volverás a verme en tu viaje.\n\nSolo podrás reclamar una tienda regular como recompensa. Todas las demás serán eliminadas.\n\n¿Deseas aceptar esta recompensa?
windows.wndgoshop.ok=Reclamar

windows.wndstory.drawfmaster=Un gran salón, un ambiente de muerte.\n\nEste era el mayor consejo del reino enano. Ahora, solo quedan sombras y ruinas.\n\nPero hay algo extraño aquí…\nUna antigua y desgastada piedra tiene la siguiente inscripción: “No cruces esta zona. Las grietas se convertirán en suelo. El general despertará…”\n¿Qué significa esto?

