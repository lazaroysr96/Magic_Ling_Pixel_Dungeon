windows.wnddragongirlblue.prompt=Gracias por tu detallada investigación. Según tus puntos de exploración, puedo ofrecerte las siguientes recompensas.\n\nLas recompensas en gris pueden indicar que hay recompensas previas sin reclamar o que ya han sido recibidas.\n\n_Investigación disponible: %d puntos_

windows.wnddragongirlblue.random_book=_Libro legendario (requiere %d puntos de investigación):_ Puedo darte un libro que compré a la señorita Nyarlathotep.
windows.wnddragongirlblue.random_book_yes=Aquí tienes este libro, %s. Quizás haga que tu próxima aventura sea más fácil.

windows.wnddragongirlblue.random_misp=_Soporte de arma arrojadiza (requiere %d puntos de investigación):_ Puedo darte un arma arrojadiza aleatoria de al menos nivel +1.
windows.wnddragongirlblue.random_misp_yes=Espero que esta arma arrojadiza te ayude en futuras aventuras.

windows.wnddragongirlblue.random_meat=_Suministro de comida (requiere %d puntos de investigación):_ Puedo darte 2 piezas de carne de pez ilusorio.
windows.wnddragongirlblue.random_meat_yes=Espero que te ayuden en momentos de hambre extrema.

windows.wnddragongirlblue.bleesed=_Bendición del linaje dragón (requiere %d puntos de investigación):_ Puedo curarte de inmediato y devolverte a tu mejor estado.
windows.wnddragongirlblue.bleesed_yes=Que mi poder te ayude a llegar más lejos.

windows.wnddragongirlblue.maxtier=_Voluntad divina de transformación (requiere %d puntos de investigación):_ Puedo otorgarte un pergamino de transformación y una poción de inspiración divina.
windows.wnddragongirlblue.maxtier_yes=Espero que estos suministros te sean útiles.

windows.wnddragongirlblue.maxring=_Anillo de búsqueda del tesoro (requiere %d puntos de investigación):_ Puedo darte un anillo identificado de nivel +1 que lleva una maldición.
windows.wnddragongirlblue.maxring_yes=Asegúrate de purificar este anillo antes de usarlo.

windows.wnddragongirlblue.up=_Bendición de la doncella (requiere %d puntos de investigación):_ Mi poder puede mejorar cualquier arma en al menos un nivel.
windows.wnddragongirlblue.up_yes=Espero que el arma mejorada sea más útil. Has canjeado todas mis recompensas disponibles. ¡Espero que tu aventura vaya bien!

windows.wnddragongirlblue.gold=_Intercambio de monedas (requiere %d puntos de investigación):_ Puedo darte una pequeña cantidad de oro.
windows.wnddragongirlblue.gold_yes=Espero que estas monedas te den más opciones en la tienda.

windows.wnddragongirlblue.pro=_Puntos de misión adicionales (requiere %d puntos de investigación):_ Los puntos de investigación restantes pueden convertirse en 1000 puntos de misión.
windows.wnddragongirlblue.pro_yes=Espero que estos puntos te ayuden a progresar mejor.

