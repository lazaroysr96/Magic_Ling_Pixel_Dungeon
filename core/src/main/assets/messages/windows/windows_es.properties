windows.wndchallenges$8.middle_desc=Si al activar desafíos el juego inicia con 0 desafíos, haz clic en el botón de calibración de desafíos a la izquierda para corregirlo.\n\nSi ya estás en partida, aquí verás la cantidad de desafíos activados y el bono de puntuación.

windows.wndscorebreakdown.title=Detalles de la puntuación
windows.wndscorebreakdown.progress_title=Juego
windows.wndscorebreakdown.progress_desc=Basado en la profundidad máxima alcanzada y el nivel del héroe.\nPuntuación de juego = Puntos por profundidad: %d x Puntos por nivel del héroe: %d x 65\nLímite máximo: 50000
windows.wndscorebreakdown.treasure_title=Exploración de tesoros
windows.wndscorebreakdown.treasure_desc=Basado en el oro recolectado y el valor de los objetos.\nPuntuación de tesoros = Oro obtenido: %d + Valor de los objetos: %d\nLímite máximo: 20000
windows.wndscorebreakdown.treasure_desc_old=Basado en el oro recolectado.
windows.wndscorebreakdown.explore_title=Exploración
windows.wndscorebreakdown.explore_desc=Basado en la cantidad de niveles completamente explorados, secretos descubiertos y acertijos resueltos.\nPuntuación de exploración = Niveles completamente explorados: %d x Niveles jugados: %d x 50
windows.wndscorebreakdown.bosses_title=Batalla contra jefes
windows.wndscorebreakdown.bosses_desc=Basado en la cantidad de jefes derrotados. Recibir daño innecesario en estas batallas reducirá la puntuación.\nPuntuación de jefes = Puntos por jefe 1: %d + Puntos por jefe 2: %d + Puntos por jefe 3: %d + Puntos por jefe 4: %d + Puntos por jefe 5: %d + Puntos por jefe 6: %d
windows.wndscorebreakdown.quests_title=Misiones
windows.wndscorebreakdown.quests_desc=Basado en las misiones completadas.\nPuntuación de misiones = Misión 1: %d + Misión 2: %d + Misión 3: %d + Misión 4: %d + Misión 5: %d
windows.wndscorebreakdown.win_multiplier=Multiplicador de victoria
windows.wndranking$statstab.custom_seed=_Semilla personalizada_
windows.wndscorebreakdown.seed_multiplier=Penalización por semilla
windows.wndscorebreakdown.diff_multiplier=Multiplicador de dificultad
windows.wndscorebreakdown.hard_desc=Basado en la dificultad global del juego.\nFácil: 0.5x, Normal: 1x, Difícil: 2x, Modo desarrollador: 0x (No implementado, usa valor predeterminado de 1).
windows.wndscorebreakdown.challenge_multiplier=Multiplicador de desafíos
windows.wndscorebreakdown.challenge_multiplier_desc=Basado en la cantidad de desafíos activados.\nMultiplicador de desafíos = (1.25 elevado a %d desafíos activados) x 20, redondeado al entero más cercano y dividido por 20.
windows.wndscorebreakdown.total=Puntuación total
windows.wndscorebreakdown.total_desc=Puntuación acumulada durante toda la partida.\nPuntuación total = (Puntuación de juego + Puntuación de exploración + Puntuación de jefes + Puntuación de misiones) x Multiplicador de progreso (base 1, victoria suma +1, éxito en retorno suma +0.5) x Multiplicador de desafíos x Penalización por semilla (semilla personalizada 0.5, sin semilla 1) x Multiplicador de dificultad (no implementado, usa valor predeterminado de 1).
windows.wndscorebreakdown.total_level=Nivel de puntuación
windows.wndscorebreakdown.total_level_desc=Evaluación de la partida.\nReglas básicas: La puntuación total debe ser igual o mayor al puntaje base requerido x Multiplicador de desafíos (para nivel SSS, se reduce a la mitad).\nPuntaje base por nivel:\n    Nivel E: 3000\n    Nivel D: 4000\n    Nivel C: 5000\n    Nivel B: 10000\n    Nivel A: 20000\n    Nivel S: 50000\n    Nivel SS: 100000\n    Nivel SSS: 200000\n    Nivel SSS+: 240000\nDesde el nivel D en adelante, si fallas en la partida, el puntaje requerido se duplica:\n    D, C, B, A: 2x\n    S, SS: 3x\n    SSS: 4x\n    SSS+: 5x
windows.wndscorebreakdown.old_score_desc=En la versión v0.5, las partidas tenían menos categorías de puntuación, pero la puntuación por progreso aumentaba en un 50%, y el límite de puntuación por tesoros también se incrementaba.

