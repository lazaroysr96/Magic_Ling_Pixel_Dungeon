windows.wndnyzshop.nayaziwelcome=Hola, aventurero. Bienvenido a mi tienda. A diferencia de otras tiendas, aquí estamos conectados a un terminal inteligente.\n\nElige lo que necesites, pero ten en cuenta que el terminal a veces tiene fallos. Si el sistema falla, no podrás comprar nuevamente.\n\nLos libros tienen un precio inicial de 720 monedas de oro (con un mínimo de 100 en caso de fallo), y un set de bombas cuesta 270 monedas de oro (mínimo de 50 en caso de fallo). ¡Elige lo que quieras!\n\nPor la naturaleza defectuosa de la máquina, el costo real puede ser mayor de lo esperado.\n\nCantidad de compras realizadas: %d veces.

windows.wndnyzshop.rush=Hola, aventurero. Bienvenido a mi tienda. Emmm… ¿Nos hemos visto antes? ¡No importa! Aquí todos los libros y bombas cuestan 5 vales por compra.

windows.wndnyzshop.notgetbadges=Hola, aventurero. Bienvenido a mi tienda. A diferencia de otras tiendas, aquí estamos conectados a un terminal inteligente.\n\nElige lo que necesites, pero ten en cuenta que el terminal a veces tiene fallos. Si el sistema falla, no podrás comprar nuevamente.\n\nLos libros tienen un precio inicial de 720 monedas de oro (con un mínimo de 100 en caso de fallo), y un set de bombas cuesta 270 monedas de oro (mínimo de 50 en caso de fallo). ¡Elige lo que quieras!\n\nPor la naturaleza defectuosa de la máquina, el costo real puede ser mayor de lo esperado.\n\nAún no has obtenido la insignia _Gran Nyaruko_. Compra 7 veces para desbloquearla.\n\nCantidad de compras realizadas: %d veces.
