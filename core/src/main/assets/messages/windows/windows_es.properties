windows.wndblacksmith.prompt=Bien, como hablamos antes, puedo darte una recompensa.\n\n_Gratitud disponible: %d_
windows.wndblacksmith.pickaxe=_Pico cruzado (requiere %d de gratitud):_ Creo que puedo darte este pico, tengo varios por aquí.
windows.wndblacksmith.pickaxe_verify=¿Seguro que quieres esta cosa vieja? Las piedras de aquí no son como las de una mina, no podrás excavar túneles con esto.
windows.wndblacksmith.pickaxe_free=De acuerdo, lo hiciste bien, te lo doy gratis.
windows.wndblacksmith.pickaxe_yes=Sí, lo quiero.
windows.wndblacksmith.pickaxe_no=Mejor no.
windows.wndblacksmith.reforge=_Reforjar (requiere %d de gratitud):_ Puedo combinar dos objetos idénticos identificados y hacer uno con mejor calidad.
windows.wndblacksmith.harden=_Endurecimiento (requiere %d de gratitud):_ Puedo fortalecer armas o armaduras identificadas, haciendo que sus encantamientos y grabados sean más resistentes.
windows.wndblacksmith.upgrade=_Mejorar (requiere %d de gratitud):_ Trae un objeto identificado de menos de nivel +2, puedo fortalecerlo.
windows.wndblacksmith.smith=_Forjar (requiere %d de gratitud):_ Puedo crear un arma o armadura personalizada de alta calidad, con mejoras adicionales. Mi fragua puede producir varias piezas, así que puedes elegir la que más te convenga.
windows.wndblacksmith.smith_verify=Bien, voy a encender la fragua. En un momento podrás hacer tu elección.
windows.wndblacksmith.smith_yes=De acuerdo, enciende la fragua.
windows.wndblacksmith.smith_no=Mejor no.
windows.wndblacksmith.cashout=_Canjear (consume toda la gratitud):_ También puedo darte algo de oro acumulado con los años en esta cueva, un punto de gratitud por cada moneda.
windows.wndblacksmith.cashout_verify=Está bien, aquí tienes %d monedas de oro. Una vez que lo tomes, estaremos en paz, ¡no vuelvas a suplicarme después!
windows.wndblacksmith.cashout_yes=Dame las monedas.
windows.wndblacksmith.cashout_no=Mejor no.
windows.wndblacksmith$wndreforge.message=Bien, puedo combinar dos objetos idénticos identificados para hacer uno de mejor calidad.
