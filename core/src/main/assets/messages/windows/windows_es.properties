windows.wndwandmaker.dust=Oh, veo que has conseguido el polvo mágico. ¡No te preocupes por esos fantasmas, puedo encargarme de ellos! Tal como prometí, puedes elegir una varita de alta calidad hecha por mí.
windows.wndwandmaker.ember=Oh, veo que has conseguido la brasa mágica. Espero que el elemental de fuego no haya causado demasiados problemas. Tal como prometí, puedes elegir una varita de alta calidad hecha por mí.
windows.wndwandmaker.berry=Oh, veo que has conseguido la baya mágica. Espero que esa planta no te haya dado demasiados problemas. Tal como prometí, puedes elegir una varita de alta calidad hecha por mí.
windows.wndwandmaker.farewell=¡Buena suerte en tus pruebas, %s!

windows.wndstory.bossrushstart=Cuando regresas una vez más a la mazmorra, notas que la atmósfera ha cambiado.\n\nLa entrada parece haber sufrido una alteración, y Él y Nyaruko esperan ansiosamente a alguien.
#windows.wndstory.bossrushstart=Usando el poder de la Espada Llave, abrimos un portal. Tras un destello de luz blanca, llegamos a un lugar desconocido.\n\nEste sitio es un lago oscuro, privado de luz por incontables años. No parece haber señales de vida, pero una inmensa energía fluye en su interior. ¿Qué criatura habita aquí?
windows.wndstory.nomobs=A petición de Él, entras de nuevo en la mazmorra. Sin embargo, lo que ves no es el bosque familiar, sino un paisaje helado.\n\nNo se perciben signos de vida, aunque los suministros acumulados cerca indican que alguien pasó por aquí recientemente.
windows.wndstory.calaboss=La nieve se detiene donde reaparecen los árboles.\n\nUna sensación familiar te invade: conoces bien lo que estos densos árboles representan. La fruta roja y fragante a la distancia confirma tus sospechas.
windows.wndstory.sewsboss=Una criatura oscura aparece frente a ti. Si no te equivocas, debe ser un ser peculiar que habita en otras mazmorras: el Gelatinus.\n\nGelatinus parece ser mucho más peligroso que antes. Procede con cautela.
windows.wndstory.skingboss=Tras la muerte de Gelatinus, el estruendo de su explosión despierta al Rey Slime. Su gigantesca silueta bloquea tu camino.
windows.wndstory.tenguboss=El asesino que yacía en las sombras ha roto sus cadenas.\n\nLa energía maligna no lo ha dañado, sino que ha fortalecido su cuerpo.\n\nTengu es más peligroso que nunca. Procede con cautela.
windows.wndstory.dimandkingboss=Los fragmentos destrozados del Mimic han sido reconstruidos y convertidos en una máquina de combate sin emociones.\n\nSientes que esta entidad no es el mismo rey que enfrentaste antes, sino una mera imitación de su forma.
windows.wndstory.dm300boss=Una máquina minera desechada por los enanos, oxidada y cubierta de aceite.\n\n¿Por qué aún se mueve?
windows.wndstory.dm720boss=Una versión de producción masiva de la máquina minera enana DM700, equipada con mecanismos ofensivos para pulverizar las rocas que caen de la cueva.\n\nDM720 fue el último grito tecnológico antes de la caída del reino enano.
windows.wndstory.icegirlboss=Por razones desconocidas, la bruja sellada ha roto sus cadenas. Sus ojos, inyectados en sangre, se posan sobre ti.
windows.wndstory.kawboss=El antiguo rey enano ya no es más. Lo que ves ante ti es solo un cadáver ambulante. Derrótalo y permite que esta nación afligida recupere la paz.
windows.wndstory.lkxboss=La noticia de la muerte del rey enano ha recorrido todo el reino. Un visitante inesperado se acerca rápidamente.
windows.wndstory.fireboss=La Bruja de las Llamas Oscuras no te ha ofrecido una galleta como lo hacía antes.
windows.wndstory.zotboss=Las energías más perversas de la mazmorra se han reunido en una sola entidad, dando vida a este monstruo aterrador. Yog-Zot es la manifestación real de toda la maldad del mundo.
windows.wndstory.dmzero=Todo lo que has experimentado no es más que un reflejo de los recuerdos de la mazmorra. El tiempo distorsionado se ha retorcido sobre sí mismo, formando una línea sinuosa y confusa. La mano que trastoca el tiempo aparece ante ti.
windows.wndstory.end=El tiempo aquí se ha detenido.\n\nEn este espacio de absoluta distorsión, DM-ZERO, una máquina de inmensa amenaza invadida por seres desconocidos, se alza frente a ti.\n\nEs una ciudad de acero que aprisiona el flujo del tiempo.

windows.wndgameinprogress.dlc=Dificultad

windows.wnddlc.title=Seleccionar dificultad
conducts.null=Investigación formal (Predeterminado)
conducts.easy=Turismo en la mazmorra (Próximamente)
conducts.easy_desc=Contexto de dificultad:\n\nXXXXX

conducts.normal=Investigación formal
conducts.normal_desc=Contexto de dificultad:\n\nEsto no es solo un juego. Los vencedores pueden elegir vivir en uno de los tres grandes reinos de la superficie. Los aventureros llegan aquí para probarse a sí mismos, con la esperanza de alcanzar la vida que desean. Aquellos que fracasan serán absorbidos por la mazmorra, mientras que los vencedores disfrutarán de la gloria y la riqueza. Pero detrás de todo esto, las cosas no son tan pacíficas…\n\nTodos los valores de juego son normales.\n\nEn la investigación formal, la puntuación se calcula de manera estándar y se puede participar en el ranking y desbloquear insignias.

conducts.hard=Enfrentar la mazmorra (Próximamente)
conducts.hard_desc=Contexto de dificultad:\n\nLos tres grandes reinos de la superficie —el Imperio Helado, la Ciudad Abismal y el Santuario Verde— han firmado un pacto secreto para afrontar el desastre inminente.\n\nUtilizan la mazmorra como un campo de prueba para el "Corazón de Cristal", una fuente de energía antigua que proviene del dios creador. Los líderes de la superficie filtran y absorben las almas de los aventureros en la mazmorra para mantener la energía en funcionamiento.\n\nLos derrotados se convertirán en alimento para el Corazón de Cristal, mientras que los vencedores recibirán la "Marca del Alma" y se convertirán en piezas clave para enfrentar la catástrofe.\n\nCaracterísticas de dificultad:\n1. Se inicia con un objeto especial que tiene efectos positivos y negativos.\n2. Al derrotar a un jefe, aparecerá un misterioso NPC que ofrecerá una oportunidad de transformación.\n3. En los niveles 10 y 20, hay una posibilidad adicional de obtener objetos raros de los jefes.\n\nEnfrentar la mazmorra multiplica la puntuación x2.

conducts.dev=Modo desarrollador
conducts.dev_desc=El modo desarrollador ha sido trasladado, lo que significa que ha sido excluido de los desafíos.\n\nAsimismo, el desafío de la ciudad solitaria será parte del modo difícil en el futuro. Los desafíos vacantes serán implementados en próximas actualizaciones.\n\nModo exclusivo para pruebas y desarrollo:\n1. Se puede moverse libremente entre pisos.\n2. Se puede participar en peleas virtuales.\n3. Muchas más funciones, explóralas.\n\nNota: El modo desarrollador no cuenta para insignias ni desafíos.

conducts.seed=Modo de verificación de semilla (No seleccionar)
conducts.seed_desc=Este modo se usa para verificar semillas de mazmorra. ¡No inicies el juego con este modo activado!

conducts.moneyletgo=Era dorada
conducts.moneyletgo_desc=La mazmorra ha entrado en una fiebre del oro. En esta era de riquezas, todo dentro de la mazmorra tiene un precio establecido. Los comerciantes están ganando enormes cantidades de dinero, por lo que han decidido ofrecer un descuento del 50% en sus tiendas.\nSin embargo, donde hay dinero, hay ambición. Ella conoce el estado de la mazmorra, y ahora los monstruos pueden soltar monedas adicionales. A medida que profundizas en la mazmorra, esta ventaja se debilita.\n\n-_En el modo de investigación profunda, solo se puede activar un modo a la vez y no se cuenta para la insignia de desafíos múltiples._

conducts.seadlc=Profundidades azules y ruinas sumergidas (DLC)
conducts.seadlc_desc=Desde que los aventureros comenzaron a investigar la mazmorra, hemos presenciado muchos eventos.\nPero el mundo es vasto, y la mazmorra es solo una pequeña parte. Además de los misterios dentro de la mazmorra, aún hay muchas incógnitas esperando ser descubiertas. Hemos recibido una misión del Imperio Helado: viajar a lo profundo del océano para investigar las ruinas sumergidas.\nSe dice que aquí descansa una bruja dormida. Las ruinas están sumergidas en el abismo, y las criaturas originales han sido devoradas por los habitantes del océano. Corrientes oscuras recorren el lugar, ocultando innumerables peligros.

windows.wnddlcx.title=Selección de dificultad (Actualmente inactivo)
difficulty.null=Predeterminado (Normal)
difficulty.easy=Fácil
difficulty.normal=Normal
difficulty.hard=Difícil
difficulty.impossible=Infierno


difficulty.easy_desc=Emprende un viaje tranquilo, donde cada victoria es asegurada. Ajustes de dificultad fácil:\n\n-1. Todos los monstruos tienen _50% menos velocidad de ataque_.\n-2. Todos los monstruos tienen _25% menos velocidad de movimiento_.\n-3. La experiencia obtenida al derrotar monstruos aumenta _1.5 veces_ (redondeado hacia abajo si el resultado no es un número entero).\n-4. _El frío ya no desciende de manera natural_ (Aún no implementado).
difficulty.normal_desc=Una investigación estándar en la mazmorra. Todas las estadísticas permanecen en sus valores predeterminados.

difficulty.hard_desc=Enfrenta la mazmorra, donde solo la oscuridad te espera. Para la victoria, debes superar esta prueba. Ajustes de dificultad difícil:\n\n-1. Todos los monstruos tienen _50% más velocidad de ataque_.\n-2. Todos los monstruos tienen _25% más velocidad de movimiento_.\n-3. La experiencia obtenida al derrotar monstruos se reduce a _50% del valor original_ (mínimo garantizado de 1 exp si el resultado es menor a 1).\n-4. Los efectos curativos solo recuperan _50% de su valor original_.



difficulty.impossible_desc=El modo Infierno solo estará disponible cuando todos los contenidos de Mo Ling hayan sido completamente implementados y hayas completado al menos dos finales.

windows.wndwaloke.buy=Desbloquear permanentemente por %d monedas de cobalto
windows.wndwaloke.unlocked=Activar este modo
windows.wndwaloke.nomoney=¡Monedas de cobalto insuficientes! Derrota a jefes en el modo estándar para obtener más.
windows.wndwaloke.onlymode=Nota: Solo se puede activar un modo especial a la vez.

windows.wndvictorycongrats.title=¡Felicidades por tu primera victoria!
windows.wndvictorycongrats.start_text=¡Has conquistado la mazmorra! Nuevas opciones de juego han sido desbloqueadas. Ahora puedes probar lo siguiente:
windows.wndvictorycongrats.challenges=¡Ahora puedes activar el _modo desafío_! Los desafíos añaden condiciones especiales que aumentan la dificultad del juego.
windows.wndvictorycongrats.custom_mode=¡Ahora puedes usar _monedas de cobalto_ para desbloquear nuevos modos! Explora modos como Golden Butterfly y BossRush.
windows.wndvictorycongrats.dailies=¡Ahora puedes participar en _misiones diarias_! Cada día habrá una nueva misión esperándote.
windows.wndvictorycongrats.stone=¡Ahora puedes acceder al _Monumento de los Viajeros_! Te permitirá registrar los finales y las historias de cada línea temporal.

windows.wndvictorycongrats.thank_you=¡Gracias por jugar la versión modificada _Mo Ling Pixel Dungeon_ basada en Broken Pixel Dungeon!
windows.wndvictorycongrats.support_prompt=Considera unirte al equipo de construcción de la wiki de Mo Ling. Si no es de tu interés, igualmente te deseamos una excelente experiencia de juego.
windows.wndvictorycongrats.support=MLPD-WIKI
windows.wndvictorycongrats.close=Cerrar
windows.wndluowhite.talk_red=Centro de canje

windows.wndgoldburrety.message=Coloca los objetos que deseas transformar con Golden Butterfly en los ranuras adecuadas, y finalmente coloca el _Pergamino de la Mariposa Dorada_ en la _ranura central_. Si agregas otro objeto durante el proceso, vuelve a colocar el pergamino en la ranura central.\n\nTus intentos de transformación están ligados a tu comportamiento y tu misión diaria actúa como un "Buff", ofreciendo encargos especiales. Reflexiona antes de decidir.\n\n[Se deben colocar al menos dos objetos para usar el Pergamino de la Mariposa Dorada. Los objetos en la _ranura miscelánea_ no pueden ser transformados.]\n\nPor la influencia de la magia en este lugar, la transformación tomará tiempo, pero te otorgaré mi bendición para que no seas atacado durante la espera.
windows.wndgoldburrety.reforge=Transformación Golden Butterfly

