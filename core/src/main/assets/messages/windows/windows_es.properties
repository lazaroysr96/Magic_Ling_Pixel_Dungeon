scenes.heroselectscene.custom_banner_desc=Define el tema del banner que deseas. Actualmente, los términos disponibles están listados abajo; simplemente ingrésalos en el campo de texto para activarlo.\n\nTérminos temáticos disponibles: Otoño, Año Nuevo Lunar, Resurrección, Halloween, Cumpleaños, Día de los Difuntos, Navidad, Primavera, Verano, Invierno, Festival de los Faroles.
