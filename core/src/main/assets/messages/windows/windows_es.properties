windows.wndbestiary.firedragon=Registro del Jefe:\r\nNombre: Dragón de Lava \t\nVida: 233 \t\r\nAtaque base: 9-12\r\nDefensa: 5-9 \nVelocidad: Normal \tAtaque: Normal\r\nNaturaleza: Unidad voladora\t\r\nResistencias:\nInmune a corrupción, fuego, ectoplasma, llamas heladas, frío y aturdimiento\r\n\r\nDescripción del área:\r\n\t La jungla nunca fue tan silenciosa hasta que el Dragón de Lava llegó. Contaminó el núcleo del bosque, la Flor "Okrlah", lo que causó que el Guardián del Bosque, el Elemental Puro, perdiera su energía. Ahora el núcleo del bosque se ha convertido en un tumor tóxico. Por orden del Colectivo de Inteligencia Pura, debemos viajar al área de lava en el fondo del bosque y enfrentar al responsable de todo: ¡el Dragón de Lava!\r\n\r\nHabilidades del Jefe:\r\nAtaque básico:\nLanza periódicamente una onda de impacto de lava, creando un área de fuego.\nEvolución dirigida:\nConsulta el bestiario para información sobre los cinco elementos.\nCuración:\nSi su vida cae por debajo de 141, puede recibir sanación en cada evolución dirigida.\nTeletransportación arcana:\nSe teletransporta periódicamente a un altar para salir del combate.\nInvocación elemental:\nInvoca elementos periódicamente. Si su vida cae por debajo de 151, las invocaciones serán más frecuentes. Puede haber hasta 6 elementos aleatorios en el campo de batalla.

