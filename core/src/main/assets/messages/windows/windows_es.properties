windows.wndsadghost.rat=Gracias, ese horrible ratón ha sido eliminado. Finalmente puedo descansar… No entiendo qué clase de magia retorcida pudo crear una criatura tan inmunda.
windows.wndsadghost.gnoll=Gracias, ese astuto gnoll ha sido derrotado. Finalmente puedo descansar… No entiendo qué clase de magia deformada lo hizo tan traicionero.
windows.wndsadghost.crab=Gracias, ese gigantesco cangrejo ha caído. Finalmente puedo descansar… No entiendo qué clase de magia retorcida lo hizo sobrevivir tanto tiempo.
windows.wndsadghost.give_item=Toma lo que más te guste, ya no los necesito… Espero que te ayuden a seguir adelante.\n\nAdemás… Perdí algo muy valioso en esta mazmorra… Si pudieras encontrar esa… rosa…
windows.wndsadghost.ask=Gracias, aventurero.\n\nMi amada solía decirme cuánto temía a esa criatura...\n\nAsí que, aunque su muerte ya no signifique mucho para mí, aún deseo pedirte que la derrotes.\n\n¿Mi prometida? Sí… Estábamos comprometidos antes de mi muerte, pero el destino nos jugó una mala pasada. Pensé que sería una misión sencilla, pero fui emboscado...\n\nMe arrepiento profundamente, pero el arrepentimiento no cambia nada. Derrotar a la criatura que ella temía quizás sea mi último acto de redención.\n\nSeguramente ya sea la festividad del Medio Otoño, recuerdo cuando disfrutábamos los pasteles de luna bajo la luna llena...\n\nPor cierto, horneé algunos pasteles de luna, y te daré uno después de que elijas un objeto.\n\nNo fue fácil encontrar los ingredientes adecuados dentro de la mazmorra, espero que no lo desprecies.

