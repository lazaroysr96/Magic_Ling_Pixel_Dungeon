windows.wndsettings$seedfindertab.plus=¿Confirmar activación del modo de búsqueda avanzada?
windows.wndsettings$seedfindertab.plus_desc=Es cierto que la suerte es parte de la vida. A veces, el conjunto de opciones en tu búsqueda puede no incluir lo que realmente deseas, por lo que se creó el modo de búsqueda avanzada.\n\nEste modo volverá a generar un conjunto de opciones cada 5 segundos para tratar de encontrar más rápido el intervalo de semillas que buscas.\n\nSin embargo, esto solo funcionará si las condiciones de búsqueda permiten que aparezca la opción deseada. Si es un resultado 100% imposible, el modo de búsqueda avanzada no podrá ayudarte.\n\nAdemás, este modo puede requerir más capacidad de procesamiento del CPU. Si la búsqueda se congela, reinicia el juego inmediatamente.

